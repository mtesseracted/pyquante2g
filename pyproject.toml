[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyquante22"]

[project]
name = "pyquante22"
version = "0.0.0"
description = "vectorized pyquante2"
authors = [{ name = "Aaron Mahler", email = "m.tesseracted@gmail.com" }]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
gpu = ["torch"]             # machine learning extras
dev = ["black"]             # development tools
test = ["pytest","scipy",
    "mpmath"]
figs = ["matplotlib"]
#docs = ["sphinx"]           # documentation tools
