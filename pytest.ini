[pytest]
addopts = --import-mode=importlib
; addopts = --import-mode=importlib -m "not slo"
testpaths = tests
python_files = test_*.py
markers =
    gpu: tests that require a GPU
    arb: tests using the arbitrary math module
    med: tests that take a medium amount of time, >1s
    slo: tests that take a long time, >10s
